      operationId: patch_samples_self
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                project:
                  anyOf:
                  - properties:
                      $ref:
                        example: /api/v1/projects/a1b2c3d4e5f67890
                        format: uri
                        pattern: ^/api/v1/projects/[a-f0-9]{16}$
                        type: string
                    type: object
                  - $ref: '#/components/schemas/projects'
                  - type: 'null'
                  default: null
                  title: Project
                tags:
                  anyOf:
                  - items:
                      properties:
                        $ref:
                          example: /api/v1/tags/a1b2c3d4e5f67890
                          format: uri
                          pattern: ^/api/v1/tags/[a-f0-9]{16}$
                          type: string
                      type: object
                    type: array
                  - items:
                      properties:
                        name:
                          description: The tag label or name. Name must be 30 characters or fewer.
                          maxLength: 30
                          title: Name
                          type: string
                      required:
                      - name
                      title: InlineTag
                      type: object
                    type: array
                  default: []
                  title: Tags
                visibility:
                  default: private
                  description: 'Enum for the v1 API `visibility` attribute.


                    Note: this is legacy and only exists for backwards-compatibility in the public v1 API.'
                  enum:
                  - public
                  - shared
                  - private
                  - importing
                  - awaiting data
                  title: ApiV1Visibility
                  type: string
              title: SampleUpdateSchema
              type: object
        required: true
      responses:
