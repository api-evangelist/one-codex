aid: one-codex
name: One Codex
description: >-
  One Codex is a microbial genomics data platform for fast, reproducible microbiome
  sequencing and analysis. Its cloud platform pairs the "world's largest microbial
  reference database" with automated shotgun and amplicon pipelines, sample management,
  and collaboration for academic institutions, biotech companies, and clinical
  laboratories. Beyond the web application, One Codex exposes a RESTful JSON API
  (self-described with JSON Schema) covering samples, analyses, classifications,
  panels, alignments, MLST, functional profiles, jobs/workflows, projects, metadata,
  tags, documents, sequencing batches, events, and webhooks — plus an official
  `onecodex` Python client and CLI. The company also offers a Genome Library and
  end-to-end microbiome sequencing services. One Codex is a portfolio company of DCVC.
